stages:
  import-ml10m:
    cmd: lenskit data convert --movielens ml-10m.zip ml-10m
    wdir: data
    deps:
      - ml-10m.zip
    outs:
      - ml-10m
  split-ml10m:
    cmd: lenskit data split --fraction 0.15 --min-train-interactions 1 ml-10m
    wdir: data
    deps:
      - ml-10m
    outs:
      - ml-10m.train
      - ml-10m.test.parquet
  generate:
    matrix:
      data:
        - ml-10m
      pipeline:
        - popular
        - als
        - slim
    cmd: python scripts/generate-recs.py ${item.pipeline} ${item.data}
    deps:
      - scripts/generate-recs.py
      - pipelines/${item.pipeline}.toml
      - data/${item.data}.train
      - data/${item.data}.test.parquet
    params:
      # changing random seed should change outputs
      - lenskit.toml:
          - random.seed
    outs:
      - runs/${item.data}/${item.pipeline}.recs.parquet
  report:
    cmd: jupytext --sync --execute EvalMetrics.md
    deps:
      - EvalMetrics.md
      - runs/ml-10m
    outs:
      - EvalMetrics.ipynb
  report-html:
    cmd: jupyter nbconvert --to html EvalMetrics.ipynb
    deps:
      - EvalMetrics.ipynb
    outs:
      - EvalMetrics.html
